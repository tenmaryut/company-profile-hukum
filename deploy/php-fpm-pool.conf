; Pool PHP-FPM khusus situs company-profile-hukum.
; Sumber: deploy/php-fpm-pool.conf, dipasang ke /etc/php/8.3/fpm/pool.d/company-profile-hukum.conf.
[company-profile-hukum]
user = www-data
group = www-data

listen = /run/php/company-profile-hukum.sock
listen.owner = caddy
listen.group = caddy
listen.mode = 0660

pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Batasi akses berkas PHP ke folder aplikasi, data runtime, dan /tmp.
php_admin_value[open_basedir] = /srv/web/company-profile-hukum:/var/lib/company-profile-hukum:/tmp
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 8M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
